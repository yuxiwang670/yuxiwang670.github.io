name: Sync Google Scholar Publications

on: 
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: pip install -r google_scholar_crawler/requirements.txt

      - name: Sync publications
        run: python google_scholar_crawler/sync_publications.py
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}

      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/google_scholar_publications.json
          if git diff --cached --quiet; then
            echo "No publication changes."
          else
            git commit -m "Sync Google Scholar publications"
            git push
          fi
